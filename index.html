<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Рефлексия • 8-сынып Физика</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #ffffff;
      color: #1e293b;
      line-height: 1.5;
      padding: 40px 20px 64px 20px;
    }

    .container {
      max-width: 780px;
      margin: 0 auto;
    }

    .header {
      text-align: center;
      margin-bottom: 32px;
    }

    .lesson-pill {
      display: inline-block;
      background-color: #f1f5f9;
      color: #334155;
      border: 1px solid #e2e8f0;
      font-size: 13.5px;
      font-weight: 700;
      padding: 5px 14px;
      border-radius: 999px;
      margin-bottom: 12px;
    }

    .header h1 {
      font-size: clamp(26px, 3.2vw, 34px);
      font-weight: 800;
      color: #243b53;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
    }

    .header p {
      font-size: 15.5px;
      color: #7b8794;
      font-weight: 400;
    }

    .form-group {
      margin-bottom: 22px;
    }

    .form-label {
      display: block;
      font-size: 15px;
      font-weight: 700;
      color: #243b53;
      margin-bottom: 8px;
    }

    .text-input,
    .textarea-input {
      width: 100%;
      font-family: inherit;
      font-size: 15px;
      color: #102a43;
      background-color: #ffffff;
      border: 1.5px solid #d9e2ec;
      border-radius: 8px;
      padding: 12px 14px;
      transition: border-color 0.18s ease, box-shadow 0.18s ease;
      outline: none;
    }

    .text-input::placeholder,
    .textarea-input::placeholder {
      color: #9fb3c8;
    }

    .text-input:focus,
    .textarea-input:focus {
      border-color: #38a169;
      box-shadow: 0 0 0 3px rgba(56, 161, 105, 0.14);
    }

    .textarea-input {
      min-height: 112px;
      resize: vertical;
    }

    .rating-group {
      text-align: center;
      margin: 26px 0 24px 0;
    }

    .rating-group .form-label {
      text-align: left;
      margin-bottom: 14px;
    }

    .stars-row {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .star-btn {
      background: none;
      border: none;
      cursor: pointer;
      padding: 2px;
      font-size: 32px;
      line-height: 1;
      color: #cbd2d9;
      transition: transform 0.14s ease, color 0.14s ease;
    }

    .star-btn:hover {
      transform: scale(1.14);
    }

    .star-btn.active {
      color: #f6ad55;
    }

    .rating-caption {
      margin-top: 6px;
      font-size: 13px;
      font-weight: 600;
      color: #627d98;
      min-height: 18px;
    }

    .submit-btn {
      width: 100%;
      background-color: #41a849;
      color: #ffffff;
      font-family: inherit;
      font-size: 16px;
      font-weight: 700;
      border: none;
      border-radius: 8px;
      padding: 14px 20px;
      cursor: pointer;
      transition: background-color 0.16s ease, transform 0.1s ease;
      margin-top: 4px;
    }

    .submit-btn:hover:not(:disabled) {
      background-color: #36933e;
    }

    .submit-btn:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    .toast-msg {
      margin-top: 12px;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      display: none;
    }

    .toast-msg.success {
      display: block;
      background-color: #def7ec;
      color: #03543f;
      border: 1px solid #84e1bc;
    }

    .toast-msg.error {
      display: block;
      background-color: #fde8e8;
      color: #9b1c1c;
      border: 1px solid #f8b4b4;
    }

    .reviews-section {
      margin-top: 34px;
    }

    .reviews-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .reviews-header h2 {
      font-size: 19px;
      font-weight: 800;
      color: #0f172a;
    }

    .reviews-meta {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .count-chip {
      font-size: 13px;
      font-weight: 700;
      color: #334155;
      background: #f1f5f9;
      border: 1px solid #e2e8f0;
      padding: 4px 12px;
      border-radius: 999px;
    }

    .reviews-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .review-card {
      background-color: #f8fafc;
      border: 1px solid #e2e8f0;
      border-left: 4px solid #41a849;
      border-radius: 8px;
      padding: 14px 16px;
    }

    .review-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 6px;
      flex-wrap: wrap;
    }

    .review-author {
      font-size: 15px;
      font-weight: 700;
      color: #1e293b;
    }

    .review-stars {
      color: #f6ad55;
      font-size: 15px;
      letter-spacing: 1px;
    }

    .review-body {
      font-size: 14.5px;
      color: #334155;
      white-space: pre-wrap;
    }

    .review-time {
      margin-top: 6px;
      font-size: 12px;
      color: #94a3b8;
    }

    .empty-state {
      font-size: 14.5px;
      color: #94a3b8;
      padding: 14px 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="lesson-pill">8-сынып Физика • «Денелердің электрленуі. Электр заряды. Өткізгіштер мен диэлектриктер»</div>
      <h1>Рефлексия</h1>
      <p>Бүгінгі ашық сабақ туралы өз әсеріңізбен және әдістемелік ұсынысыңызбен бөлісіңіз</p>
    </header>

    <form id="feedbackForm">
      <div class="form-group">
        <label class="form-label" for="colleagueName">Аты-жөніңіз (қалауыңызша):</label>
        <input
          type="text"
          id="colleagueName"
          class="text-input"
          placeholder="Мысалы: Айгүл ханым немесе Арман ағай"
        />
      </div>

      <div class="rating-group">
        <label class="form-label">Сабақ бойынша әсеріңіз бен көңіл-күйіңізді бағалаңыз:</label>
        <div class="stars-row" id="starsRow">
          <button type="button" class="star-btn" data-val="1" aria-label="1 жұлдыз">★</button>
          <button type="button" class="star-btn" data-val="2" aria-label="2 жұлдыз">★</button>
          <button type="button" class="star-btn" data-val="3" aria-label="3 жұлдыз">★</button>
          <button type="button" class="star-btn" data-val="4" aria-label="4 жұлдыз">★</button>
          <button type="button" class="star-btn" data-val="5" aria-label="5 жұлдыз">★</button>
        </div>
        <div class="rating-caption" id="ratingCaption"></div>
      </div>

      <div class="form-group">
        <label class="form-label" for="feedbackText">Бүгінгі сабақтан алған әсеріңіз немесе ұсынысыңыз:</label>
        <textarea
          id="feedbackText"
          class="textarea-input"
          placeholder="Бүгінгі сабақта маған ерекше ұнағаны..."
        ></textarea>
      </div>

      <button type="submit" class="submit-btn" id="submitBtn">Кері байланысты жіберу</button>
      <div class="toast-msg" id="toastMsg"></div>
    </form>

    <section class="reviews-section">
      <div class="reviews-header">
        <h2>Әріптестердің пікірлері:</h2>
        <div class="reviews-meta">
          <span class="count-chip" id="reviewsCount">Барлығы: 0 пікір</span>
        </div>
      </div>
      <div class="reviews-list" id="reviewsList"></div>
    </section>
  </div>

  <script>
    const PROJECT_ID = 'fizika-8-refleksiya-18d5b';
    const COLLECTION_NAME = 'fizika_8_colleague_feedbacks';
    const FIRESTORE_URL = `https://firestore.googleapis.com/v1/projects/${PROJECT_ID}/databases/(default)/documents/${COLLECTION_NAME}`;

    const RATING_LABELS = {
      1: '1 / 5 — Төмен',
      2: '2 / 5 — Орташадан төмен',
      3: '3 / 5 — Жақсы',
      4: '4 / 5 — Өте жақсы',
      5: '5 / 5 — Керемет әсер алдым!'
    };

    let selectedRating = 0;

    const starBtns = document.querySelectorAll('.star-btn');
    starBtns.forEach(btn => {
      btn.addEventListener('mouseenter', () => {
        highlightStars(Number(btn.dataset.val));
      });
      btn.addEventListener('mouseleave', () => {
        highlightStars(selectedRating);
      });
      btn.addEventListener('click', () => {
        selectedRating = Number(btn.dataset.val);
        highlightStars(selectedRating);
        document.getElementById('ratingCaption').textContent = RATING_LABELS[selectedRating] || '';
      });
    });

    function highlightStars(count) {
      starBtns.forEach(btn => {
        btn.classList.toggle('active', Number(btn.dataset.val) <= count);
      });
    }

    function escapeHTML(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function showToast(message, isError = false) {
      const toast = document.getElementById('toastMsg');
      toast.textContent = message;
      toast.className = `toast-msg ${isError ? 'error' : 'success'}`;
      toast.style.display = 'block';
      setTimeout(() => {
        toast.style.display = 'none';
        toast.className = 'toast-msg';
      }, 3500);
    }

    function parseDoc(doc) {
      const f = doc.fields || {};
      return {
        name: (f.name && f.name.stringValue) || 'Әріптес мұғалім',
        rating: Number((f.rating && f.rating.integerValue) || 0),
        text: (f.text && f.text.stringValue) || '',
        timeText: (f.timeText && f.timeText.stringValue) || '',
        createdAtMs: Number((f.createdAtMs && f.createdAtMs.integerValue) || 0)
      };
    }

    async function renderReviews() {
      const listEl = document.getElementById('reviewsList');
      const countEl = document.getElementById('reviewsCount');

      try {
        const res = await fetch(FIRESTORE_URL + '?pageSize=100');
        if (!res.ok) {
          throw new Error('HTTP ' + res.status);
        }
        const data = await res.json();
        const docs = Array.isArray(data.documents) ? data.documents : [];
        const reviews = docs.map(parseDoc).sort((a, b) => b.createdAtMs - a.createdAtMs);

        countEl.textContent = `Барлығы: ${reviews.length} пікір`;

        if (reviews.length === 0) {
          listEl.innerHTML = '<div class="empty-state">Әзірге пікірлер жазылмады. Бірінші болып өз әсеріңізбен бөлісіңіз!</div>';
          return;
        }

        listEl.innerHTML = reviews.map(item => {
          const ratingVal = Number(item.rating) || 0;
          const starsStr = ratingVal > 0
            ? '★'.repeat(ratingVal) + '☆'.repeat(5 - ratingVal)
            : '';
          return `
            <article class="review-card">
              <div class="review-top">
                <span class="review-author">${escapeHTML(item.name || 'Әріптес мұғалім')}</span>
                ${starsStr ? `<span class="review-stars">${starsStr}</span>` : ''}
              </div>
              <div class="review-body">${escapeHTML(item.text || '')}</div>
              <div class="review-time">${escapeHTML(item.timeText || '')}</div>
            </article>
          `;
        }).join('');
      } catch (err) {
        listEl.innerHTML = '<div class="empty-state">Пікірлерді жүктеу кезінде қате шықты. Firestore базасы құрылғанын және ережелерін тексеріңіз.</div>';
      }
    }

    const form = document.getElementById('feedbackForm');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const nameInput = document.getElementById('colleagueName');
      const textInput = document.getElementById('feedbackText');

      const name = nameInput.value.trim() || 'Әріптес мұғалім';
      const text = textInput.value.trim();

      if (!text) {
        showToast('Өтінеміз, сабақ туралы пікіріңізді немесе ұсынысыңызды жазыңыз.', true);
        textInput.focus();
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Жіберілуде...';

      const now = new Date();
      const timeText = now.toLocaleTimeString('kk-KZ', { hour: '2-digit', minute: '2-digit' }) +
        ' • ' + now.toLocaleDateString('kk-KZ');

      const payload = {
        fields: {
          name: { stringValue: name },
          rating: { integerValue: String(selectedRating) },
          text: { stringValue: text },
          timeText: { stringValue: timeText },
          createdAtMs: { integerValue: String(Date.now()) }
        }
      };

      try {
        const res = await fetch(FIRESTORE_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        if (!res.ok) {
          throw new Error('HTTP ' + res.status);
        }

        nameInput.value = '';
        textInput.value = '';
        selectedRating = 0;
        highlightStars(0);
        document.getElementById('ratingCaption').textContent = '';

        await renderReviews();
        showToast('Рақмет! Сіздің кері байланысыңыз ортақ тізімге қосылды.');
      } catch (err) {
        showToast('Сақтау кезінде қате шықты. Firestore ережелерін тексеріңіз.', true);
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Кері байланысты жіберу';
      }
    });

    renderReviews();
  </script>
</body>
</html>

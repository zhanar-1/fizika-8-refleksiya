<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>8-сынып физика — Рефлексия</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: linear-gradient(135deg, #eef2ff 0%, #f8fafc 100%);
      color: #1e293b;
      line-height: 1.6;
      padding: 24px 16px;
    }

    .container {
      max-width: 720px;
      margin: 0 auto;
      background: #ffffff;
      border-radius: 16px;
      padding: 28px 24px;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
      border: 1px solid #e2e8f0;
    }

    h1 {
      font-size: 1.6rem;
      color: #0f172a;
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 0.95rem;
      color: #475569;
      margin-bottom: 24px;
    }

    .question-block {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 8px;
      color: #1e293b;
    }

    input[type="text"],
    textarea,
    select {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      font-size: 1rem;
      font-family: inherit;
      background: #ffffff;
      color: #0f172a;
    }

    input[type="text"]:focus,
    textarea:focus,
    select:focus {
      outline: none;
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    .mood-group {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .mood-btn {
      flex: 1 1 120px;
      padding: 10px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      background: #f8fafc;
      color: #1e293b;
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .mood-btn:hover {
      background: #eff6ff;
      border-color: #93c5fd;
    }

    .mood-btn.active {
      background: #2563eb;
      color: #ffffff;
      border-color: #2563eb;
    }

    .submit-btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: #16a34a;
      color: #ffffff;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .submit-btn:hover {
      background: #15803d;
    }

    .message {
      margin-top: 16px;
      padding: 12px 14px;
      border-radius: 10px;
      display: none;
      font-size: 0.95rem;
    }

    .message.success {
      display: block;
      background: #dcfce7;
      color: #166534;
      border: 1px solid #86efac;
    }

    .message.error {
      display: block;
      background: #fee2e2;
      color: #991b1b;
      border: 1px solid #fca5a5;
    }

    .history-section {
      margin-top: 28px;
      padding-top: 20px;
      border-top: 1px solid #e2e8f0;
    }

    .history-section h2 {
      font-size: 1.15rem;
      margin-bottom: 12px;
      color: #0f172a;
    }

    .entry-card {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 10px;
      font-size: 0.92rem;
    }

    .entry-meta {
      font-weight: 600;
      color: #334155;
      margin-bottom: 4px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>8-сынып физика — Сабақ соңындағы рефлексия</h1>
    <p class="subtitle">Бүгінгі сабақ бойынша түсінгеніңіз бен сұрақтарыңызды бөлісіңіз.</p>

    <form id="reflectionForm">
      <div class="question-block">
        <label for="studentName">Оқушының аты-жөні</label>
        <input type="text" id="studentName" placeholder="Мысалы: Әлихан Сәрсенов" required>
      </div>

      <div class="question-block">
        <label>Сабақты қалай меңгердіңіз?</label>
        <div class="mood-group" id="moodGroup">
          <button type="button" class="mood-btn" data-value="Толық түсіндім">Толық түсіндім</button>
          <button type="button" class="mood-btn" data-value="Сұрақтарым бар">Сұрақтарым бар</button>
          <button type="button" class="mood-btn" data-value="Қайталау керек">Қайталау керек</button>
        </div>
        <input type="hidden" id="understandingLevel" value="">
      </div>

      <div class="question-block">
        <label for="learnedText">Бүгін не үйрендіңіз?</label>
        <textarea id="learnedText" placeholder="Негізгі ұғымдарды немесе мысалдарды жазыңыз..."></textarea>
      </div>

      <div class="question-block">
        <label for="questionText">Қандай сұрақ немесе қиындық туындады?</label>
        <textarea id="questionText" placeholder="Түсініксіз тұсы болса, осында жазыңыз..."></textarea>
      </div>

      <button type="submit" class="submit-btn">Жауапты сақтау</button>
      <div id="statusMessage" class="message"></div>
    </form>

    <div class="history-section">
      <h2>Осы құрылғыда сақталған жауаптар</h2>
      <div id="entriesList"></div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = "fizika_8_refleksiya_entries";
    const form = document.getElementById("reflectionForm");
    const moodButtons = document.querySelectorAll(".mood-btn");
    const levelInput = document.getElementById("understandingLevel");
    const statusMessage = document.getElementById("statusMessage");
    const entriesList = document.getElementById("entriesList");

    moodButtons.forEach((button) => {
      button.addEventListener("click", () => {
        moodButtons.forEach((btn) => btn.classList.remove("active"));
        button.classList.add("active");
        levelInput.value = button.dataset.value;
      });
    });

    function getEntries() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        return raw ? JSON.parse(raw) : [];
      } catch (error) {
        return [];
      }
    }

    function saveEntries(entries) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(entries));
    }

    function renderEntries() {
      const entries = getEntries();
      if (entries.length === 0) {
        entriesList.innerHTML = "<p class=\"subtitle\">Әзірге жауаптар сақталмаған.</p>";
        return;
      }

      entriesList.innerHTML = entries
        .map((entry) => {
          return `
            <div class="entry-card">
              <div class="entry-meta">${escapeHtml(entry.name)} — ${escapeHtml(entry.level)} (${escapeHtml(entry.date)})</div>
              <div><strong>Үйрендім:</strong> ${escapeHtml(entry.learned || "—")}</div>
              <div><strong>Сұрақ:</strong> ${escapeHtml(entry.question || "—")}</div>
            </div>
          `;
        })
        .join("");
    }

    function escapeHtml(text) {
      const div = document.createElement("div");
      div.textContent = text;
      return div.innerHTML;
    }

    form.addEventListener("submit", (event) => {
      event.preventDefault();

      const name = document.getElementById("studentName").value.trim();
      const level = levelInput.value.trim();
      const learned = document.getElementById("learnedText").value.trim();
      const question = document.getElementById("questionText").value.trim();

      if (!name || !level) {
        statusMessage.textContent = "Аты-жөніңізді жазып, сабақты меңгеру деңгейін таңдаңыз.";
        statusMessage.className = "message error";
        return;
      }

      const entries = getEntries();
      entries.unshift({
        name: name,
        level: level,
        learned: learned,
        question: question,
        date: new Date().toLocaleString("kk-KZ")
      });

      saveEntries(entries);
      renderEntries();

      statusMessage.textContent = "Жауабыңыз сәтті сақталды!";
      statusMessage.className = "message success";

      form.reset();
      levelInput.value = "";
      moodButtons.forEach((btn) => btn.classList.remove("active"));
    });

    renderEntries();
  </script>
</body>
</html>
